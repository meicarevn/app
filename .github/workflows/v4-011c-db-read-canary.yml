name: V4_011C Controlled DB Read-path Canary

on:
  push:
    branches:
      - v4-011c-db-read-canary
    paths:
      - "web-shadow/**"
      - "shadow-pages/**"
      - "src/intelligence-v4-011*.ts"
      - "src/shadow-access.ts"
      - "test/intelligence-v4-011*.test.ts"
      - "docs/V4_011C_*.md"
      - ".github/workflows/v4-011c-db-read-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://v4-011c-db-read-canary.meicare-smart-pharmacy.pages.dev
      ORG_ID: 68d83220-4e5d-46e7-8bd3-7863205985f4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck and unit tests
        run: |
          npm run check
          npm test

      - name: Preview JavaScript syntax
        run: |
          node --check web-shadow/app.js
          node --check web-shadow/login.js
          node --check web-shadow/multi-axis-review.js
          node --check web-shadow/multi-axis-canary.js

      - name: V4_011C static safety guards
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -Eiq 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_|service_role' web-shadow shadow-pages/functions; then
            echo "Forbidden service credential marker found in V4_011C preview source"
            exit 1
          fi
          grep -q 'V4_011C · DB READ-PATH CANARY' web-shadow/multi-axis-canary.html
          grep -q 'inventory_intelligence_multi_axis_v4_011' shadow-pages/functions/v4/shadow/intelligence-v4-011-canary.ts
          grep -q 'projectMultiAxisRows' shadow-pages/functions/v4/shadow/intelligence-v4-011-canary.ts
          grep -q 'organization_scope' shadow-pages/functions/v4/shadow/intelligence-v4-011-canary.ts
          grep -q 'METHOD_NOT_ALLOWED' shadow-pages/functions/v4/shadow/intelligence-v4-011-canary.ts
          grep -q 'exact_parity' src/intelligence-v4-011-canary.ts
          if grep -Eq 'method:[[:space:]]*"(POST|PUT|PATCH|DELETE)"' shadow-pages/functions/v4/shadow/intelligence-v4-011-canary.ts; then
            echo "V4_011C canary endpoint contains a mutation fetch"
            exit 1
          fi

      - name: Assemble Pages public directory
        run: |
          rm -rf shadow-pages/public
          mkdir -p shadow-pages/public
          cp -R web-shadow/. shadow-pages/public/

      - name: Cloudflare credentials status
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials missing."
          fi

      - name: Deploy isolated V4_011C read-path canary
        if: steps.cf.outputs.ready == 'true'
        working-directory: shadow-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name meicare-smart-pharmacy --branch v4-011c-db-read-canary --commit-dirty=true

      - name: Live preview fail-closed smoke
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          wait_for() {
            local label="$1" method="$2" url="$3" expected="$4" marker="$5" body="$6"
            for attempt in $(seq 1 12); do
              if [ "$method" = "POST" ]; then
                code=$(curl -sS -X POST -H 'content-type: application/json' -d '{}' -o "$body" -w '%{http_code}' "$url" || true)
              else
                code=$(curl -sS -L -o "$body" -w '%{http_code}' "$url" || true)
              fi
              echo "$label attempt=$attempt status=$code"
              if [ "$code" = "$expected" ] && grep -q "$marker" "$body"; then return 0; fi
              if [ "$attempt" = "12" ]; then
                echo "$label failed; expected HTTP $expected and marker $marker"
                cat "$body" || true
                return 1
              fi
              sleep 5
            done
          }

          wait_for "canary page" GET "$PREVIEW_URL/multi-axis-canary" 200 'V4_011C' /tmp/canary.html
          wait_for "canary unauthenticated" GET "$PREVIEW_URL/v4/shadow/intelligence-v4-011-canary?organization_id=$ORG_ID" 401 'UNAUTHORIZED' /tmp/canary.json
          wait_for "canary POST fail closed" POST "$PREVIEW_URL/v4/shadow/intelligence-v4-011-canary?organization_id=$ORG_ID" 405 'METHOD_NOT_ALLOWED' /tmp/canary-post.json

      - name: Canary deployment summary
        if: always()
        run: |
          echo "### V4_011C Controlled DB Read-path Canary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Isolated alias: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Primary path: production additive DB projection via human JWT + RLS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Comparison path: existing Cloudflare TypeScript projection" >> "$GITHUB_STEP_SUMMARY"
          echo "- GET-only; no service-role; no global routing change" >> "$GITHUB_STEP_SUMMARY"
          echo "- frontend_v4_ready remains false" >> "$GITHUB_STEP_SUMMARY"
