name: V4_014 Dependency Lock Refresh

on:
  push:
    branches:
      - v4-014-care-coordination
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4-014-care-coordination

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate pinned lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(v4-014a): refresh dependency lock"
          git push origin HEAD:v4-014-care-coordination
