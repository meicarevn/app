name: V4 Shadow Read CI

on:
  pull_request:
    paths:
      - "src/shadow.ts"
      - "src/shadow-worker.ts"
      - "src/shadow-access.ts"
      - "src/role-admin.ts"
      - "src/member-admin.ts"
      - "src/member-admin-read.ts"
      - "web-shadow/**"
      - "test/shadow.test.ts"
      - "test/shadow-access.test.ts"
      - "test/role-admin.test.ts"
      - "test/member-admin.test.ts"
      - "supabase/migrations/**"
      - "supabase/functions/meicare-member-admin-v4/**"
      - "wrangler.shadow.toml.example"
      - ".github/workflows/v4-009-shadow-ci.yml"
  push:
    branches:
      - "v4-009-frontend-shadow"
      - "v4-009b-shadow-role-ux"
      - "v4-009c-scoped-rbac"
      - "v4-009d-org-structure"
      - "v4-009e-role-administration"
      - "v4-009f-member-lifecycle-ui"
    paths:
      - "src/shadow.ts"
      - "src/shadow-worker.ts"
      - "src/shadow-access.ts"
      - "src/role-admin.ts"
      - "src/member-admin.ts"
      - "src/member-admin-read.ts"
      - "web-shadow/**"
      - "test/shadow.test.ts"
      - "test/shadow-access.test.ts"
      - "test/role-admin.test.ts"
      - "test/member-admin.test.ts"
      - "supabase/migrations/**"
      - "supabase/functions/meicare-member-admin-v4/**"
      - "wrangler.shadow.toml.example"
      - ".github/workflows/v4-009-shadow-ci.yml"

permissions:
  contents: read

jobs:
  shadow-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck all Worker sources
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Shadow UI JavaScript syntax
        run: |
          node --check web-shadow/app.js
          node --check web-shadow/role-ux.js
          node --check web-shadow/member-admin.js
      - name: Shadow Worker must remain read-only
        run: |
          if grep -Eq 'method:[[:space:]]*"(POST|PUT|PATCH|DELETE)"|SUPABASE_SERVICE_ROLE_KEY' src/shadow.ts src/shadow-worker.ts src/shadow-access.ts src/member-admin-read.ts; then
            echo "Shadow read layer contains a forbidden mutation/service-role marker"
            exit 1
          fi
      - name: RBAC session gate must be present
        run: |
          grep -q '/v4/shadow/session' src/shadow-worker.ts
          grep -q 'SHADOW_PERMISSION_DENIED' src/shadow-access.ts
          grep -q 'role-ux.js' web-shadow/index.html
      - name: Scoped role administration guards must be present
        run: |
          FILE=supabase/migrations/20260906024255_v4_009e_scoped_role_administration.sql
          grep -q 'create or replace function public.assign_membership_role_v4' "$FILE"
          grep -q 'create or replace function public.end_membership_role_v4' "$FILE"
          grep -q 'security invoker' "$FILE"
          grep -q 'LAST_OWNER_CANNOT_BE_ENDED' "$FILE"
          grep -q 'OWNER_ROLE_REQUIRES_OWNER' "$FILE"
          grep -q 'ROLE_ASSIGNMENT_HISTORY_IMMUTABLE' "$FILE"
          grep -q 'revoke insert,update,delete on public.membership_roles from authenticated' "$FILE"
          grep -q 'warehouses_scoped_select_v4' supabase/migrations/20260906024639_v4_009e_scope_catalog_rls_hardening.sql
      - name: V4_009F member lifecycle guards must be present
        run: |
          FILE=supabase/migrations/20260906030000_v4_009f_member_lifecycle.sql
          grep -q 'REVIEW ONLY' "$FILE"
          grep -q 'OWNER_STATUS_PROTECTED' "$FILE"
          grep -q 'INVITED_MUST_SELF_ACTIVATE' "$FILE"
          grep -q 'activate_my_invited_memberships_v4' "$FILE"
          grep -q 'set_member_status_v4' "$FILE"
          grep -q 'MEMBER_LIFECYCLE_V4' "$FILE"
          grep -q 'membership_roles mr' "$FILE"
          grep -q 'security invoker' "$FILE"
          grep -q 'member_admin_v4' supabase/migrations/20260906030100_v4_009f_member_admin_read_models.sql
      - name: Member admin Edge Function must use governed RPCs
        run: |
          FILE=supabase/functions/meicare-member-admin-v4/index.ts
          grep -q 'validate_member_invite_v4' "$FILE"
          grep -q 'register_invited_member_v4' "$FILE"
          grep -q 'set_member_status_v4' "$FILE"
          grep -q 'assign_membership_role_v4' "$FILE"
          grep -q 'end_membership_role_v4' "$FILE"
          if grep -Eq '\.from\(["'"']organization_members["'"']\).*\.(insert|update|upsert|delete)' "$FILE"; then
            echo "Edge Function performs forbidden direct organization_members mutation"
            exit 1
          fi
