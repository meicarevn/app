name: V4_011E1 Isolated Logical Restore Drill V2

on:
  push:
    branches:
      - v4-011e1-logical-restore-drill
    paths:
      - "scripts/v4-011e1-app-restore-manifest.sql"
      - "scripts/v4-011e1-compare-app-manifests.cjs"
      - ".github/workflows/v4-011e1-logical-restore-drill-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-011e1-logical-restore-drill-v2
  cancel-in-progress: false

jobs:
  logical-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_REF: sgxufmcsnveyyddazwuk
      OWNER_USER_ID: dd9b8038-6a2f-46cd-a429-14e14eb94484
      ORG_ID: 68d83220-4e5d-46e7-8bd3-7863205985f4
      EXPECTED_MIGRATION_COUNT: "59"
      EXPECTED_LATEST_MIGRATION: "20260906072831"
      EXPECTED_PROJECTION_ROWS: "2244"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve encrypted database credential
        shell: bash
        env:
          URL_A: ${{ secrets.SUPABASE_DB_URL }}
          URL_B: ${{ secrets.SUPABASE_DATABASE_URL }}
          URL_C: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${URL_A:-}" ]; then
            SOURCE_DB_URL="$URL_A"; CREDENTIAL_SOURCE="SUPABASE_DB_URL"
          elif [ -n "${URL_B:-}" ]; then
            SOURCE_DB_URL="$URL_B"; CREDENTIAL_SOURCE="SUPABASE_DATABASE_URL"
          elif [ -n "${URL_C:-}" ]; then
            SOURCE_DB_URL="$URL_C"; CREDENTIAL_SOURCE="DATABASE_URL"
          else
            echo MISSING_DB_CREDENTIAL_SECRET
            exit 2
          fi
          echo "::add-mask::$SOURCE_DB_URL"
          echo "SOURCE_DB_URL=$SOURCE_DB_URL" >> "$GITHUB_ENV"
          echo "CREDENTIAL_SOURCE=$CREDENTIAL_SOURCE" >> "$GITHUB_ENV"

      - name: Verify source baseline
        shell: bash
        run: |
          set -euo pipefail
          docker version --format '{{.Server.Version}}'
          psql --version
          npx --yes supabase@latest --version
          read -r migration_count latest_migration < <(
            psql "$SOURCE_DB_URL" -X -q -A -t -v ON_ERROR_STOP=1 \
              -c "select count(*)::text || ' ' || coalesce(max(version),'') from supabase_migrations.schema_migrations;"
          )
          test "$migration_count" = "$EXPECTED_MIGRATION_COUNT"
          test "$latest_migration" = "$EXPECTED_LATEST_MIGRATION"
          echo "migration_count=$migration_count" >> "$GITHUB_ENV"
          echo "latest_migration=$latest_migration" >> "$GITHUB_ENV"

      - name: Capture source manifest before dump
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/v4-011e1"
          mkdir -p "$WORK"
          psql "$SOURCE_DB_URL" -X -q -A -t -v ON_ERROR_STOP=1 \
            -f scripts/v4-011e1-app-restore-manifest.sql \
            | grep -v '^[[:space:]]*$' | tail -n 1 > "$WORK/source-before.json"
          jq -e . "$WORK/source-before.json" >/dev/null
          test "$(jq -r '.projection_rows' "$WORK/source-before.json")" = "$EXPECTED_PROJECTION_ROWS"
          test "$(jq -r '.ledger_drift_rows' "$WORK/source-before.json")" = "0"

      - name: Create Supabase-filtered logical dump
        id: dump
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/v4-011e1"
          dump_started=$(date +%s)
          npx --yes supabase@latest db dump --db-url "$SOURCE_DB_URL" -f "$WORK/roles.sql" --role-only
          npx --yes supabase@latest db dump --db-url "$SOURCE_DB_URL" -f "$WORK/schema.sql"
          npx --yes supabase@latest db dump --db-url "$SOURCE_DB_URL" -f "$WORK/data.sql" --use-copy --data-only
          dump_finished=$(date +%s)
          sha256sum "$WORK/roles.sql" "$WORK/schema.sql" "$WORK/data.sql" > "$WORK/checksums.sha256"
          echo "dump_seconds=$((dump_finished-dump_started))" >> "$GITHUB_OUTPUT"
          for name in roles schema data; do
            echo "${name}_sha=$(awk -v n="$name.sql" '$2 ~ n"$" {print $1}' "$WORK/checksums.sha256")" >> "$GITHUB_OUTPUT"
            echo "${name}_bytes=$(stat -c%s "$WORK/$name.sql")" >> "$GITHUB_OUTPUT"
          done

      - name: Capture source manifest after dump
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/v4-011e1"
          psql "$SOURCE_DB_URL" -X -q -A -t -v ON_ERROR_STOP=1 \
            -f scripts/v4-011e1-app-restore-manifest.sql \
            | grep -v '^[[:space:]]*$' | tail -n 1 > "$WORK/source-after.json"
          jq -e . "$WORK/source-after.json" >/dev/null

      - name: Start isolated Supabase PostgreSQL 17 target
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name meicare-v4-011e1-restore \
            -e POSTGRES_PASSWORD=postgres \
            -p 127.0.0.1:54322:5432 \
            public.ecr.aws/supabase/postgres:17.6.1.165 >/dev/null
          for attempt in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs meicare-v4-011e1-restore --tail 100
          exit 1

      - name: Prepare portable isolated restore inputs
        shell: bash
        env:
          RESTORE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/v4-011e1"

          # Managed Supabase roles/schemas are supplied by the isolated Supabase image.
          # Preserve hashes of the original dumps as evidence, but restore only the
          # application domain into the disposable target.
          awk '
            BEGIN { IGNORECASE=1 }
            /^(GRANT|REVOKE|ALTER DEFAULT PRIVILEGES|ALTER .* OWNER TO)/ && /"(supabase_|pg_)[A-Za-z0-9_]*"/ { next }
            { print }
          ' "$WORK/schema.sql" > "$WORK/schema-portable.sql"

          python3 - "$WORK/data.sql" "$WORK/data-portable.sql" "$WORK/managed-data-filter.json" <<'PY'
          import json, re, sys

          src, dst, report = sys.argv[1:]
          managed = {
              'auth', 'storage', 'realtime', '_realtime', 'supabase_functions',
              'graphql', 'graphql_public', 'vault', 'extensions', 'cron', 'net'
          }
          copy_re = re.compile(r'^COPY\s+(?:"([^\"]+)"|([^\.\s]+))\.', re.I)
          setval_re = re.compile(r"setval\('(?:\"?([^\"\.']+)\"?)\.", re.I)
          skipped_copy = 0
          skipped_statement = 0
          skipping_copy = False

          with open(src, encoding='utf-8') as inp, open(dst, 'w', encoding='utf-8') as out:
              for line in inp:
                  if skipping_copy:
                      if line.rstrip('\n') == r'\.':
                          skipping_copy = False
                      continue

                  m = copy_re.match(line)
                  if m:
                      schema = (m.group(1) or m.group(2) or '').lower()
                      if schema in managed:
                          skipped_copy += 1
                          skipping_copy = True
                          continue

                  m = setval_re.search(line)
                  if m and m.group(1).lower() in managed:
                      skipped_statement += 1
                      continue

                  out.write(line)

          with open(report, 'w', encoding='utf-8') as f:
              json.dump({
                  'managed_copy_sections_excluded': skipped_copy,
                  'managed_sequence_statements_excluded': skipped_statement
              }, f)
          PY

          jq -e . "$WORK/managed-data-filter.json" >/dev/null
          managed_copy_sections=$(jq -r '.managed_copy_sections_excluded' "$WORK/managed-data-filter.json")
          echo "managed_copy_sections_excluded=$managed_copy_sections"
          test "$managed_copy_sections" -ge "1"

          api_role_count=$(psql "$RESTORE_DB_URL" -X -q -A -t -v ON_ERROR_STOP=1 \
            -c "select count(*) from pg_roles where rolname in ('anon','authenticated','service_role');")
          echo "isolated_api_role_count=$api_role_count"
          test "$api_role_count" = "3"

          auth_contract_count=$(psql "$RESTORE_DB_URL" -X -q -A -t -v ON_ERROR_STOP=1 \
            -c "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='auth' and p.proname in ('uid','role');")
          echo "isolated_auth_contract_count=$auth_contract_count"
          test "$auth_contract_count" = "2"

          echo "portable_restore_managed_roles=reused_from_target" >> "$GITHUB_ENV"
          echo "portable_restore_auth_contracts=$auth_contract_count" >> "$GITHUB_ENV"
          echo "portable_restore_managed_copy_sections=$managed_copy_sections" >> "$GITHUB_ENV"

      - name: Restore logical dump into isolated target
        id: restore
        shell: bash
        env:
          RESTORE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/v4-011e1"
          restore_started=$(date +%s)
          psql "$RESTORE_DB_URL" \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file "$WORK/schema-portable.sql" \
            --command 'SET session_replication_role = replica' \
            --file "$WORK/data-portable.sql"
          echo "restore_seconds=$(($(date +%s)-restore_started))" >> "$GITHUB_OUTPUT"

      - name: Compare restored application state
        shell: bash
        env:
          RESTORE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/v4-011e1"
          psql "$RESTORE_DB_URL" -X -q -A -t -v ON_ERROR_STOP=1 \
            -f scripts/v4-011e1-app-restore-manifest.sql \
            | grep -v '^[[:space:]]*$' | tail -n 1 > "$WORK/restored.json"
          jq -e . "$WORK/restored.json" >/dev/null
          node scripts/v4-011e1-compare-app-manifests.cjs \
            "$WORK/source-before.json" "$WORK/source-after.json" "$WORK/restored.json" \
            | tee "$WORK/compare-result.json"

      - name: RLS and application read smoke
        shell: bash
        env:
          RESTORE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          owner_rows=$(psql "$RESTORE_DB_URL" -X -q -A -t -v ON_ERROR_STOP=1 <<SQL
          begin;
          set local role authenticated;
          select set_config('request.jwt.claims', '{"sub":"${OWNER_USER_ID}","role":"authenticated"}', true);
          select count(*) from public.inventory_intelligence_v4 where organization_id = '${ORG_ID}'::uuid;
          rollback;
          SQL
          )
          owner_rows=$(printf '%s\n' "$owner_rows" | grep -E '^[0-9]+$' | tail -n1)
          test "$owner_rows" = "$EXPECTED_PROJECTION_ROWS"

          denied_rows=$(psql "$RESTORE_DB_URL" -X -q -A -t -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local role authenticated;
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-4000-8000-000000000001","role":"authenticated"}', true);
          select count(*) from public.inventory_intelligence_v4;
          rollback;
          SQL
          )
          denied_rows=$(printf '%s\n' "$denied_rows" | grep -E '^[0-9]+$' | tail -n1)
          test "$denied_rows" = "0"

          multi_axis_rows=$(psql "$RESTORE_DB_URL" -X -q -A -t -v ON_ERROR_STOP=1 \
            -c "select count(*) from public.inventory_intelligence_multi_axis_v4_011 where organization_id = '${ORG_ID}'::uuid;")
          multi_axis_rows=$(printf '%s\n' "$multi_axis_rows" | grep -E '^[0-9]+$' | tail -n1)
          test "$multi_axis_rows" = "$EXPECTED_PROJECTION_ROWS"
          echo "owner_rls_rows=$owner_rows" >> "$GITHUB_ENV"
          echo "denied_rls_rows=$denied_rows" >> "$GITHUB_ENV"
          echo "multi_axis_rows=$multi_axis_rows" >> "$GITHUB_ENV"

      - name: Record non-sensitive evidence
        if: success()
        shell: bash
        run: |
          echo "### V4_011E1 Isolated Logical Restore Drill — PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production mutation/downtime: none / none" >> "$GITHUB_STEP_SUMMARY"
          echo "- Credential source: $CREDENTIAL_SOURCE (masked)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migration baseline: $migration_count / $latest_migration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dump / restore duration: ${{ steps.dump.outputs.dump_seconds }}s / ${{ steps.restore.outputs.restore_seconds }}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- roles.sql bytes/SHA256: ${{ steps.dump.outputs.roles_bytes }} / ${{ steps.dump.outputs.roles_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- schema.sql bytes/SHA256: ${{ steps.dump.outputs.schema_bytes }} / ${{ steps.dump.outputs.schema_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- data.sql bytes/SHA256: ${{ steps.dump.outputs.data_bytes }} / ${{ steps.dump.outputs.data_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Managed COPY sections excluded from application restore: $portable_restore_managed_copy_sections" >> "$GITHUB_STEP_SUMMARY"
          echo "- OWNER / unauthorized / multi-axis rows: $owner_rls_rows / $denied_rls_rows / $multi_axis_rows" >> "$GITHUB_STEP_SUMMARY"
          echo "- Managed API roles/auth contracts reused from isolated Supabase target; original role/data dump checksums remain recorded." >> "$GITHUB_STEP_SUMMARY"
          echo "- Raw dump files were never uploaded or committed." >> "$GITHUB_STEP_SUMMARY"

      - name: Secure cleanup
        if: always()
        shell: bash
        run: |
          set +e
          docker rm -f meicare-v4-011e1-restore >/dev/null 2>&1
          WORK="$RUNNER_TEMP/v4-011e1"
          if [ -d "$WORK" ]; then
            find "$WORK" -maxdepth 1 -type f -exec shred -u {} \; 2>/dev/null || true
            rm -rf "$WORK"
          fi
