name: V4_014 Care Coordination Preview

on:
  push:
    branches:
      - v4-014-care-coordination
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-014-care-coordination-preview
  cancel-in-progress: false

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_NAME: meicare-platform
      PREVIEW_BRANCH: v4-014-care-coordination
      PREVIEW_URL: https://v4-014-care-coordination.meicare-platform.pages.dev
      BASELINE_URL: https://meicare-platform.pages.dev
      ROLLBACK_URL: https://meicare-smart-pharmacy.pages.dev
      CANARY_ORG_ID: 68d83220-4e5d-46e7-8bd3-7863205985f4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm run check
          npm test
          npm audit --audit-level=high
          for file in web-shadow/*.js; do node --check "$file"; done

      - name: V4_014A care safety guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"/v4/shadow/care": "workflow.view"' src/shadow-access.ts
          grep -q 'source_type: "in.(CARE_SIGNAL,CARE_CASE,CARE_FOLLOWUP)"' src/shadow.ts
          grep -q 'data-view="care"' web-shadow/index.html
          grep -q 'api("/v4/shadow/care"' web-shadow/app.js
          if grep -n 'select:.*description\|select:.*metadata' src/shadow.ts | grep -q 'care'; then
            echo "Care route must not expose free-form description or metadata"
            exit 1
          fi
          if grep -R -n 'frontend_v4_ready[[:space:]]*=[[:space:]]*true' web-platform web-shadow src; then
            echo "V4_014A must not mutate frontend_v4_ready"
            exit 1
          fi
          if grep -R -Eiq 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_|service_role' web-platform web-shadow shadow-pages/functions; then
            echo "Forbidden service credential marker found in browser or Pages source"
            exit 1
          fi
          if grep -R -n "$CANARY_ORG_ID" web-platform web-shadow; then
            echo "A production organization id is hard-coded in a browser asset"
            exit 1
          fi

      - name: Assemble isolated Pages preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p platform-pages/public platform-pages/functions
          cp -R web-shadow/. platform-pages/public/
          cp -R shadow-pages/functions/. platform-pages/functions/
          cp web-platform/index.html platform-pages/public/index.html
          cp web-platform/platform.css platform-pages/public/platform.css
          cp web-platform/_headers platform-pages/public/_headers
          test -f platform-pages/public/404.html
          test -f platform-pages/public/_headers

      - name: Cloudflare preview credential status
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -n "${CF_TOKEN:-}" ] && [ -n "${CF_ACCOUNT:-}" ]; then
            echo "::add-mask::$CF_TOKEN"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy isolated V4_014A preview
        if: steps.cf.outputs.ready == 'true'
        working-directory: platform-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy public             --project-name "$PROJECT_NAME"             --branch "$PREVIEW_BRANCH"             --commit-hash "$GITHUB_SHA"             --commit-dirty=true

      - name: Unauthenticated preview smoke
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          wait_for() {
            local label="$1" method="$2" url="$3" expected="$4" marker="$5" body="$6"
            for attempt in $(seq 1 18); do
              code=$(curl -sS -X "$method" -o "$body" -w '%{http_code}' "$url" || true)
              echo "$label attempt=$attempt status=$code"
              if [ "$code" = "$expected" ] && grep -q "$marker" "$body"; then return 0; fi
              if [ "$attempt" = "18" ]; then cat "$body" || true; return 1; fi
              sleep 5
            done
          }
          wait_for "platform" GET "$PREVIEW_URL/" 200 'MEICARE PLATFORM · V4' /tmp/platform.html
          wait_for "care navigation" GET "$PREVIEW_URL/" 200 'Hàng đợi chăm sóc' /tmp/care.html
          wait_for "care unauthenticated" GET "$PREVIEW_URL/v4/shadow/care?organization_id=$CANARY_ORG_ID" 401 'UNAUTHORIZED' /tmp/care.json
          wait_for "care mutation blocked" POST "$PREVIEW_URL/v4/shadow/care?organization_id=$CANARY_ORG_ID" 405 'METHOD_NOT_ALLOWED' /tmp/care-post.json
          wait_for "route fallback" GET "$PREVIEW_URL/not-a-real-route-v4-014a" 404 'Không tìm thấy trang' /tmp/not-found.html

      - name: Rollback isolation evidence
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          baseline_status=$(curl -sS -o /tmp/baseline.html -w '%{http_code}' "$BASELINE_URL/")
          rollback_status=$(curl -sS -o /tmp/rollback.html -w '%{http_code}' "$ROLLBACK_URL/")
          test "$baseline_status" = "200"
          test "$rollback_status" = "200"
          grep -q 'MEICARE PLATFORM · V4' /tmp/baseline.html
          echo "baseline=$baseline_status rollback=$rollback_status"

      - name: Summary
        if: always()
        run: |
          echo "### V4_014A Pharmacy Care Queue" >> "$GITHUB_STEP_SUMMARY"
          echo "- Read-only care route: workflow.view + existing RLS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source allowlist: CARE_SIGNAL / CARE_CASE / CARE_FOLLOWUP" >> "$GITHUB_STEP_SUMMARY"
          echo "- Raw description/metadata: not exposed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database/runtime/readiness mutations: none" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing baseline and rollback projects: untouched" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare preview attempted: ${{ steps.cf.outputs.ready }}" >> "$GITHUB_STEP_SUMMARY"
